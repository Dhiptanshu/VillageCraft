<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <!-- Include Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Include custom styles -->
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body & Root wrapper */
    body {
      display: flex;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Sidebar */
    .sidebar {
      background-color: #2c3e50;
      color: white;
      height: 100%;
      transition: transform 0.3s ease;
      padding: 15px;
    }

    .sidebar .nav-link {
      color: white;
      transition: color 0.3s ease;
    }

    .sidebar .nav-link:hover {
      color: #18bc9c;
    }

    /* Main content area */
    .main-content {
      background-color: #ecf0f1;
      height: 100%;
      padding: 20px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
    }

    /* Header */
    header {
      background-color: #34495e;
      color: white;
      padding: 15px 20px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Table Styles */
    .table thead th {
      background-color: #34495e;
      color: white;
    }

    table tbody tr:hover {
      background-color: #bdc3c7;
    }

    /* Dashboard Widget Card */
    .stat-card {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      background: white;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: scale(1.05);
    }

    /* Footer */
    /* footer {
      padding: 10px 0;
      background-color: #34495e;
      color: white;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    } */

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.active {
        transform: translateX(0);
      }
    }
  </style>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    table, th, td {
      border: 1px solid #000;
    }

    th, td {
      padding: 10px;
      text-align: left;
    }

    select {
      margin: 10px 0;
      padding: 5px;
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar bg-dark">
    <div class="logo text-center mb-4">
      <h5>Village Craft</h5>
    </div>
    <nav class="nav flex-column">
      <a href="#" class="nav-link"><i class="bi bi-house-door"></i> Dashboard</a>
      <a href="#" class="nav-link"><i class="bi bi-person"></i> Users</a>
      <a href="#" class="nav-link" onclick="fetchData()">
        <i class="bi bi-graph-up"></i> Analytics
      </a>
      <a href="#" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header Section -->
    <header>
      <div class="d-flex align-items-center">
        <button class="btn btn-light btn-sm" id="toggleSidebar">☰ Menu</button>
      </div>
      <div>
        <button class="btn btn-outline-light btn-sm">Profile</button>
      </div>
    </header>

    <div class="icon-card mb-100" style="padding-left: 10px; height: 30rem;" id="bhakti">
        <canvas width="1500" height="2px" style="display:block;width:1500px;height:2px;cursor:auto;"></canvas>
    </div>

    <!-- Dashboard Section -->
    <section class="container my-4">
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="stat-card shadow-sm">
            <!--<h5>Total Users</h5>
            <h3>100</h3>-->
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card shadow-sm">
            <!--<h5>Active Sessions</h5>
            <h3>75</h3>-->
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card shadow-sm">
            <!--<h5>Revenue</h5>
            <h3>$12K</h3>-->
          </div>
        </div>
      </div>

      <!-- Table Section -->
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">User Activity</div>
        <div class="card-body">
          
            
            <table id="data-table">
                <label for="userDropdown">Select User ID:</label>
            <select id="userDropdown" style="margin: 10px 0; padding: 5px;">
              <option value="all">All</option>
            </select>
                <thead>
                  <tr>
                    <th>User ID</th>
                    <th>Place</th>
                    <th>Point X</th>
                    <th>Point Y</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Data rows will dynamically populate here -->
                </tbody>
              </table>
            <script>
                let fullData = []; // Store all fetched data for filtering
            
              async function getData() {
                const url = 'https://glsmoodle.in/vaat/viewplace.php';
            
                try {
                  const response = await fetch(url);
            
                  if (!response.ok) {
                    throw new Error('Network response was not ok');
                  }
            
                  const data = await response.json();
                  console.log('Fetched data:', data);
            
                  fullData = data; // Save the entire dataset globally
            
                  const tableBody = document.querySelector('#data-table tbody');
                  const userDropdown =document.querySelector('#userDropdown');
                  tableBody.innerHTML = '';
            
                  // Extract unique user IDs
                  const uniqueUserIds = [...new Set(data.map(item => item.user_id))];
                  console.log('Unique user IDs:', uniqueUserIds);
            
                  // Populate dropdown with unique user IDs and an "All" option
                  userDropdown.innerHTML = '';
                  const allOption = document.createElement('option');
                  allOption.value = 'all';
                  allOption.textContent = 'All';
                  userDropdown.appendChild(allOption);
            
                  uniqueUserIds.forEach(userId => {
                    const option = document.createElement('option');
                    option.value = userId;
                    option.textContent = userId;
                    userDropdown.appendChild(option);
                  });
            
                  // Populate table with all data on initial load
                  populateTable(fullData);
            
                  // Add event listener to handle dropdown changes
                  userDropdown.addEventListener('change', handleFilter);
                } catch (error) {
                  console.error('Error fetching data:', error);
                }
              }
            
              function populateTable(data) {
                const tableBody = document.querySelector('#data-table tbody');
                tableBody.innerHTML = '';
            
                data.forEach(item => {
                  const row = document.createElement('tr');
            
                  const user_idCell = document.createElement('td');
                  user_idCell.textContent = item.user_id;
            
                  const placeCell = document.createElement('td');
                  placeCell.textContent = item.place;
            
                  const X_Cell = document.createElement('td');
                  X_Cell.textContent = item.point_x;
            
                  const Y_Cell = document.createElement('td');
                  Y_Cell.textContent = item.point_y;
            
                  row.appendChild(user_idCell);
                  row.appendChild(placeCell);
                  row.appendChild(X_Cell);
                  row.appendChild(Y_Cell);
            
                  tableBody.appendChild(row);
                });
              }
            
              function handleFilter() {
                const userDropdown = document.querySelector('#userDropdown');
                const selectedUserId = userDropdown.value;
            
                if (selectedUserId === 'all') {
                  // Show all rows if "All" is selected
                  populateTable(fullData);
                } else {
                  // Filter only the data for the selected user ID
                  const filteredData = fullData.filter(item => item.user_id == selectedUserId);
                  populateTable(filteredData);
                }
              }
            
              // Ensure the function runs after the DOM has loaded
              window.onload = () => getData();
            </script>

            <!--here is the code for streetlight table-->
            

  </div>

  <!-- Footer Section -->
 

  <!-- Include Bootstrap JS -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script> -->
  <script type="module" src="assets/js/new_script.js"></script>
  <script type="module" src="cost.js"></script>
  <script>
    const toggleSidebar = document.getElementById("toggleSidebar");
    const sidebar = document.querySelector('.sidebar');

    toggleSidebar.onclick = function () {
      sidebar.classList.toggle('active');
    };
  </script>
</body>

</html>
